name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish the archives to a GitHub Release for this tag'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            platform_id: darwin-arm64
          - runner: macos-15-intel
            arch: x64
            platform_id: darwin-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The newest torch no longer publishes macOS x86_64 wheels; 2.2.2 is
          # the last release with a cp312 Intel wheel. Pin it (and numpy<2,
          # which torch 2.2.2's ABI needs) on the Intel runner only.
          if [ "${{ matrix.arch }}" = "x64" ]; then
            python -m pip install "numpy<2" "torch==2.2.2"
          fi
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller==6.22.3"

      - name: Fetch bundled FFmpeg (${{ matrix.platform_id }})
        run: |
          python scripts/fetch_ffmpeg.py \
            --platform ${{ matrix.platform_id }} \
            --registry https://registry.npmjs.org
          file ffmpeg/${{ matrix.platform_id }}/ffmpeg ffmpeg/${{ matrix.platform_id }}/ffprobe

      - name: Build .app bundle
        run: |
          python -m PyInstaller --noconfirm --clean UnipusAI-Helper.spec
          test -d "dist/UnipusAI-Helper.app" || (echo "::error::.app bundle was not produced" && exit 1)

      - name: Ad-hoc sign (keep the bundle structurally valid)
        run: |
          codesign --force --deep --sign - "dist/UnipusAI-Helper.app" || true
          codesign --verify --deep --strict "dist/UnipusAI-Helper.app" || true

      - name: Ship the release notes next to the app
        run: |
          mkdir -p dist/release
          cp README.md dist/release/README.md
          cp "dist/UnipusAI-Helper.app/Contents/Info.plist" dist/release/Info.plist || true
          cat > dist/release/README-macOS.txt <<'EOF'
          UnipusAI-Helper — macOS
          
          1. Move "UnipusAI-Helper.app" to /Applications (or anywhere you like).
          2. If macOS says the app is damaged or from an unidentified developer, run:
                 xattr -cr /Applications/UnipusAI-Helper.app
             This clears the quarantine flag on an unsigned, ad-hoc signed build.
          3. Launch it once. The built-in Setup page appears on first run; save your
             configuration and relaunch. Configuration and logs are stored in
                 ~/Library/Application Support/UnipusAI-Helper/
             so the .app bundle itself stays read-only.
          4. FFmpeg / ffprobe are bundled inside the app; no Homebrew install or network
             download is needed for speech recognition.
          
          Voice features also need Microsoft Edge; the built-in environment check
          guides you through installing it if it is missing.
          EOF

      - name: Archive .app (preserve symlinks + executable bits)
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            "UnipusAI-Helper.app" \
            "UnipusAI-Helper-macOS-${{ matrix.arch }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnipusAI-Helper-macOS-${{ matrix.arch }}
          path: |
            dist/UnipusAI-Helper-macOS-${{ matrix.arch }}.zip
            dist/release/README-macOS.txt
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/UnipusAI-Helper-macOS-${{ matrix.arch }}.zip
          fail_on_unmatched_files: true
