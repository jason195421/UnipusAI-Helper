name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish the DMGs to a GitHub Release for this tag'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
        mode: [debug, release]
        include:
          - arch: arm64
            runner: macos-15
            platform_id: darwin-arm64
          - arch: x64
            runner: macos-15-intel
            platform_id: darwin-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The newest torch no longer publishes macOS x86_64 wheels; 2.2.2 is
          # the last release with a cp312 Intel wheel. Pin it (and numpy<2,
          # which torch 2.2.2's ABI needs) on the Intel runner only.
          if [ "${{ matrix.arch }}" = "x64" ]; then
            python -m pip install "numpy<2" "torch==2.2.2"
          fi
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller==6.22.3"

      - name: Fetch bundled FFmpeg (${{ matrix.platform_id }})
        run: |
          python scripts/fetch_ffmpeg.py \
            --platform ${{ matrix.platform_id }} \
            --registry https://registry.npmjs.org
          file ffmpeg/${{ matrix.platform_id }}/ffmpeg ffmpeg/${{ matrix.platform_id }}/ffprobe

      - name: Fetch bundled Whisper model (base)
        run: |
          python scripts/fetch_whisper.py
          test -f whisper_models/base.pt || (echo "::error::base.pt missing" && exit 1)

      - name: Build ${{ matrix.mode }} variant + DMG
        run: |
          python scripts/build_variant.py --mode "${{ matrix.mode }}"
          test -f "installer/UnipusAI-Helper-macOS-${{ matrix.arch }}-${{ matrix.mode }}.dmg" || (echo "::error::DMG was not produced" && exit 1)

      - name: Ship the release notes
        run: |
          mkdir -p dist/release
          cp README.md dist/release/README.md
          cat > dist/release/README-macOS.txt <<'EOF'
          UnipusAI-Helper — macOS (${{ matrix.arch }}, ${{ matrix.mode }})

          This DMG contains the ${{ matrix.mode }} build.

          release : a standard .app bundle. Double-click it from Finder; no
                    Terminal window is shown. Drag it to /Applications.
          debug   : a plain folder plus "Run-Debug.command". Double-click the
                    .command file to launch from Terminal so console output
                    stays visible while troubleshooting.

          If macOS says the app is damaged or from an unidentified developer:
              xattr -cr /Applications/UnipusAI-Helper.app
          This clears the quarantine flag on an unsigned, ad-hoc signed build.

          Launch once: the built-in Setup page appears on first run; save your
          configuration and relaunch. Configuration and logs live in
              ~/Library/Application Support/UnipusAI-Helper/
          so the .app bundle itself stays read-only.

          FFmpeg / ffprobe and the Whisper "base" model are bundled; no
          Homebrew or network download is needed for speech recognition,
          even on the first run. Voice features also need Microsoft Edge,
          which the built-in environment check helps you install.
          EOF

      - name: Smoke test (offscreen, non-fatal)
        continue-on-error: true
        run: |
          python scripts/smoke_test.py --mode "${{ matrix.mode }}" --seconds 12

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnipusAI-Helper-macOS-${{ matrix.arch }}-${{ matrix.mode }}-logs
          path: dist/**/logs/*.log
          if-no-files-found: ignore

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: UnipusAI-Helper-macOS-${{ matrix.arch }}-${{ matrix.mode }}
          path: |
            installer/UnipusAI-Helper-macOS-${{ matrix.arch }}-${{ matrix.mode }}.dmg
            dist/release/README-macOS.txt
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/UnipusAI-Helper-macOS-${{ matrix.arch }}-${{ matrix.mode }}.dmg
          fail_on_unmatched_files: true
