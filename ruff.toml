target-version = "py312"
line-length = 120
extend-exclude = [".venv", "build", "dist", "installer", "ffmpeg", ".tools", "release", "docs", ".ruff_cache"]

[lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "PIE", "RET", "SIM"]
ignore = [
    "E402",    # 主脚本必须在改完 sys.stdout 之后才导入 whisper/selenium
    "SIM105",  # 显式 try/except 比 contextlib.suppress 更贴近原意，暂不批量改
    "RET504", "SIM102", "SIM103", "SIM108", "C416", "PIE810",
    "RET505", "PLW0603", "PLW2901", "B007", "B905", "PIE790", "SIM115",
]
